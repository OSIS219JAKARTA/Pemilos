<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Voter - SMPN 219 Jakarta</title>
  <link rel="icon" type="image/png" href="Assets/img/logo_osis.png">
  <link rel="stylesheet" href="style.css">
  <style>
  /* KARTU KANDIDAT YANG SIMPEL & RAPI */
  .candidate-card {
    border: 1px solid var(--gray, #ccc);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    background: var(--white, #ffffff);
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s;
  }

  .candidate-card:hover {
    transform: translateY(-4px);
  }

  .candidate-card img {
    width: 100% !important;
    height: 320px !important;
    object-fit: contain !important; 
    background-color: #ffffff !important; 
    border-radius: 8px !important;
    margin-bottom: 15px !important;
    padding: 5px; 
    border: 1px solid #f0f0f0;
  }

  .candidate-title {
    font-size: 1.2rem;
    font-weight: bold;
    color: var(--dark-blue, #1b4f91);
    margin: 8px 0;
  }

  .candidate-names {
    font-size: 1rem;
    font-weight: 600;
    color: #333;
    margin-bottom: 15px;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-brand">
      <img src="Assets/img/logo_osis.png" alt="Logo">
      <h1>SMPN 219 JAKARTA - VOTER PANEL</h1>
    </div>
  </header>

  <!-- Bagian Form Login Voter -->
  <div id="login-section" class="container-box">
    <h2 style="text-align: center; margin-bottom: 20px; color: var(--dark-blue, #1b4f91);">Login Voter</h2>
    <form id="voter-login-form">
      <label for="voter-nis">NIS / Identitas:</label>
      <input type="text" id="voter-nis" required placeholder="Masukkan NIS Anda">

      <label for="voter-password">Password:</label>
      <input type="password" id="voter-password" required placeholder="Masukkan Password">

      <button type="submit" class="btn-primary" style="width: 100%;">Masuk & Mulai Memilih</button>
      <button type="button" class="btn-danger" style="width: 100%; margin-top: 10px;" onclick="location.href='index.html'">Kembali</button>
    </form>
  </div>

  <!-- Bagian Bilik Suara / Voting Section -->
  <div id="voting-section" style="display: none; padding: 40px;">
    <h2 style="text-align: center; color: var(--dark-blue, #1b4f91);">Halo, <span id="voter-name-display"></span></h2>
    <p style="text-align: center; margin-bottom: 25px;">Silakan pilih kandidat Ketua & Wakil Ketua OSIS terbaik menurut Anda.</p>

    <div id="candidates-list" class="candidate-grid"></div>
  </div>

  <footer class="app-footer">&copy; SMPN219JAKARTA. All rights reserved.</footer>

  <script type="module" src="voter.js"></script>
</body>
</html>
